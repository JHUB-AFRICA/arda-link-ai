<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="phbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C1C28"/>
      <stop offset="1" stop-color="#15151F"/>
    </linearGradient>
    <pattern id="phgrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#2A2A38" stroke-width="0.6"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#phgrid)"/>
  <rect width="400" height="400" fill="url(#phbg)" opacity="0.7"/>
  <rect x="6" y="6" width="388" height="388" rx="10" fill="none" stroke="#2A2A38" stroke-width="1.4" stroke-dasharray="6 5"/>
  <!-- camera glyph -->
  <g transform="translate(170.0, 150.0)" fill="none" stroke="#A8A29E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 12 14 L 18 8 L 42 8 L 48 14 L 60 14 A 4 4 0 0 1 64 18 L 64 50 A 4 4 0 0 1 60 54 L 4 54 A 4 4 0 0 1 0 50 L 0 18 A 4 4 0 0 1 4 14 Z"/>
    <circle cx="32" cy="34" r="11"/>
    <circle cx="32" cy="34" r="5" fill="#F59E0B" stroke="none"/>
  </g>
  <!-- label -->
  <text x="200.0" y="224.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#F5F5F4">Icon: step 1</text>
  <text x="200.0" y="246.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#A8A29E">small phone/screen glyph</text>
  <!-- corner tag -->
  <g transform="translate(300, 14)">
    <rect x="0" y="0" width="86" height="22" rx="11" fill="#1C1C28" stroke="#2A2A38"/>
    <text x="43" y="15" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5" fill="#71717A">PLACEHOLDER</text>
  </g>
  <!-- aspect tag -->
  <text x="14" y="386" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#71717A" letter-spacing="1">400 × 400</text>
</svg>