      <path d="M0,0 L10,5 L0,10 Z" fill="#2A2A38"/>
    </marker>
  </defs>
  <rect width="1600" height="600" fill="#0B0B12"/>
  <path d="M 292 290.0 L 588 290.0" stroke="#2A2A38" stroke-width="3" marker-end="url(#arrow)"/><path d="M 732 290.0 L 1028 290.0" stroke="#2A2A38" stroke-width="3" marker-end="url(#arrow)"/><path d="M 1172 290.0 L 1428 290.0" stroke="#2A2A38" stroke-width="3" marker-end="url(#arrow)"/>
  
  <circle cx="220" cy="290.0" r="64" fill="#1C1C28" stroke="#38BDF8" stroke-width="3"/>
