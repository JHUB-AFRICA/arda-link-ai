  <!-- satellite glyph -->
  <g transform="translate(220,290.0)" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-8" y="-4" width="16" height="8" rx="1.5" fill="#F5F5F4" stroke="none"/>
    <rect x="-30" y="-2" width="16" height="12" rx="1.5"/>
    <rect x="14" y="-2" width="16" height="12" rx="1.5"/>
  </g>
  <!-- AI / brief glyph -->
