name: ardalink

# Production hand-off stack — same services as compose.yml, but pulls
# pre-built images from Docker Hub instead of building from source. Use
# this when the person bringing the stack up doesn't have (or shouldn't
# need) the source tree — just this file, .env, and `docker compose pull`.
#
# Images: munene1212/ardalink-api, munene1212/ardalink-engine,
# munene1212/ardalink-web, munene1212/ardalink-marketing — public
# repos, tagged both `latest` and a dated release (see
# ARDALINK_IMAGE_TAG below). Prefer pinning to the dated tag in any
# real deployment — `latest` moves.
#
# Services (identical to compose.yml except Evolution and marketing —
# see below — are a core part of THIS stack, not opt-in profiles):
#   postgres, redis, engine, api, web, marketing, evolution-postgres,
#   evolution-api, caddy (profile "tls")
#
# Bring-up (Evolution comes up automatically, no extra flag needed):
#   cp .env.example .env   # fill in real secrets — see that file's comments
#   docker compose -f compose.prod.yml pull
#   docker compose -f compose.prod.yml up -d
#   docker compose -f compose.prod.yml --profile tls up -d   # + Caddy/TLS
#
# NOTE on the WhatsApp bridge: `evolution-api` here is a fresh,
# unlinked instance (evoapicloud/evolution-api, third-party image, not
# built by us) — bringing this stack up gives you a NEW WhatsApp session
# to QR-link (see RUNBOOK.md's manual smoke-test / instance-create
# recipe), not a copy of any existing production session. If this
# deployment is meant to take over serving real WhatsApp traffic from
# an existing bridge (see architecture.md / deployment.md for the
# currently-live VPS setup), that's a real cutover with its own
# session-migration considerations — coordinate before pointing a real
# WABA number at this instance. Because Evolution is bundled by
# default here, WA_PROVIDER also defaults to `evolution` in this file
# (compose.yml's local-dev default stays `360dialog`) — override
# WA_PROVIDER=360dialog in .env if this deployment should use a hosted
# BSP instead.

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-restart: &default-restart
  restart: unless-stopped

services:
  postgres:
    <<: [*default-restart, *default-logging]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ardalink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ardalink_dev_only}
      POSTGRES_DB: ardalink
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ardalink -d ardalink"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    <<: [*default-restart, *default-logging]
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  engine:
    <<: [*default-restart, *default-logging]
    image: munene1212/ardalink-engine:${ARDALINK_IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgresql://ardalink:${POSTGRES_PASSWORD:-ardalink_dev_only}@postgres:5432/ardalink
      GIS_ENGINE_SCHEMA: gis_engine
      ARDALINK_HOST: 0.0.0.0
      ARDALINK_PORT: "5001"
      ARDALINK_LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GEE_SERVICE_ACCOUNT: ${GEE_SERVICE_ACCOUNT:-}
      GEE_PRIVATE_KEY: ${GEE_PRIVATE_KEY:-}
      GEE_PROJECT: ${GEE_PROJECT:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_KEY: ${AZURE_OPENAI_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-gpt-4o}
      TENANT_ATTESTATION_SECRET: ${TENANT_ATTESTATION_SECRET}
      INGEST_SCHEDULER_ENABLED: ${INGEST_SCHEDULER_ENABLED:-0}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5001:5001"

  api:
    <<: [*default-restart, *default-logging]
    image: munene1212/ardalink-api:${ARDALINK_IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://ardalink:${POSTGRES_PASSWORD:-ardalink_dev_only}@postgres:5432/ardalink
      REDIS_URL: redis://redis:6379
      # Supabase — the REAL production data store (wards, pastoralists,
      # water_nodes ground truth, whatsapp_messages). Without these two,
      # the app silently degrades to local-Postgres-only mode.
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_KEY}
      AZURE_OPENAI_CHAT_DEPLOYMENT: ${AZURE_OPENAI_CHAT_DEPLOYMENT:-gpt-4o}
      AZURE_OPENAI_WHISPER_DEPLOYMENT: ${AZURE_OPENAI_WHISPER_DEPLOYMENT:-whisper}
      AZURE_OPENAI_REALTIME_DEPLOYMENT: ${AZURE_OPENAI_REALTIME_DEPLOYMENT:-gpt-4o-realtime-preview}
      AZURE_SPEECH_ENDPOINT: ${AZURE_SPEECH_ENDPOINT:-}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-}
      TRUSTED_ORIGIN_HOSTS: ${TRUSTED_ORIGIN_HOSTS:-}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      AFRICASTALKING_USERNAME: ${AFRICASTALKING_USERNAME:-sandbox}
      AFRICASTALKING_API_KEY: ${AFRICASTALKING_API_KEY:-}
      AFRICASTALKING_CALLER_ID: ${AFRICASTALKING_CALLER_ID:-}
      SESSION_SECRET: ${SESSION_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      TENANT_ATTESTATION_SECRET: ${TENANT_ATTESTATION_SECRET}
      ARDALINK_ENGINE_BASE: http://engine:5001
      # Evolution is bundled by default in THIS stack (unlike
      # compose.yml's local-dev, opt-in-profile version), so the
      # default provider here is `evolution`, not `360dialog` — override
      # in .env if this deployment should use a hosted BSP instead.
      WA_PROVIDER: ${WA_PROVIDER:-evolution}
      THREESIXTYDIALOG_API_KEY: ${THREESIXTYDIALOG_API_KEY:-}
      THREESIXTYDIALOG_PHONE_NUMBER_ID: ${THREESIXTYDIALOG_PHONE_NUMBER_ID:-}
      EVOLUTION_API_BASE_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-dev_only_change_me}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-ardalink-dev}
    depends_on:
      postgres:
        condition: service_healthy
      engine:
        condition: service_started
      redis:
        condition: service_healthy
      evolution-api:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"

  web:
    <<: [*default-restart, *default-logging]
    image: munene1212/ardalink-web:${ARDALINK_IMAGE_TAG:-latest}
    environment:
      API_BASE_URL: http://api:3000
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:80"

  # Public marketing/conference-poster site — core here (unlike
  # compose.yml's local-dev version, where it's an opt-in profile: a
  # marketing site rebuilding on every local `make up` is more often
  # noise than useful). This stack's whole point is "the whole system
  # in one command" for a hand-off deployer, so it belongs by default.
  marketing:
    <<: [*default-restart, *default-logging]
    image: munene1212/ardalink-marketing:${ARDALINK_IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:8082:80"

  # Self-hosted WhatsApp gateway — a core part of this stack (not an
  # opt-in profile, unlike compose.yml's local-dev version). See this
  # file's header note above before treating this as a drop-in
  # replacement for any existing production bridge.
  evolution-postgres:
    <<: [*default-restart, *default-logging]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_POSTGRES_PASSWORD:-evolution_dev_only}
      POSTGRES_DB: evolution
    volumes:
      - evolution_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 3s
      retries: 10

  evolution-api:
    <<: [*default-restart, *default-logging]
    image: evoapicloud/evolution-api:v2.3.7
    environment:
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_POSTGRES_PASSWORD:-evolution_dev_only}@evolution-postgres:5432/evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/1
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-dev_only_change_me}
    depends_on:
      evolution-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"

  caddy:
    <<: [*default-restart, *default-logging]
    image: caddy:2-alpine
    profiles: ["tls"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
  evolution_pgdata:
