name: Monorepo CI

# Top-level orchestrator for the public ArdaLink monorepo. Runs all
# three service CIs in parallel after a single hygiene job, plus
# marketing-site + long-form-docs jobs.
#
# The per-service workflows at ardalink-{api,engine,web}/.github/workflows/ci.yml
# are still available as independent triggers when only one service is
# touched in a fork-PR scenario; this orchestrator is the source of
# truth for "is the whole monorepo green?".

on:
  pull_request:
    branches: [master, staging]
  push:
    branches: [master, staging]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: monorepo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paths:
    name: Paths changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      marketing: ${{ steps.filter.outputs.marketing }}
      docs: ${{ steps.filter.outputs.docs }}
      root: ${{ steps.filter.outputs.root }}
      any: ${{ steps.filter.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            engine:
              - 'ardalink-engine/**'
              - '.github/workflows/monorepo-ci.yml'
            api:
              - 'ardalink-api/**'
              - '.github/workflows/monorepo-ci.yml'
            web:
              - 'ardalink-web/**'
              - '.github/workflows/monorepo-ci.yml'
            marketing:
              - 'ardalink-marketing/**'
              - '.github/workflows/monorepo-ci.yml'
            docs:
              - 'Arda-link-AI-Docs/**'
              - 'README.md'
              - 'RUNBOOK.md'
              - 'LOCAL_SETUP.md'
              - 'LICENSE'
              - 'Arda-link-AI-Docs/architecture.md'
              - '.github/workflows/monorepo-ci.yml'
            root:
              - 'README.md'
              - 'RUNBOOK.md'
              - 'LOCAL_SETUP.md'
              - 'LICENSE'
              - 'Arda-link-AI-Docs/architecture.md'
              - '.gitignore'
              - '.github/**'
              - 'CODEOWNERS'

  hygiene:
    name: Hygiene (root)
    needs: paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fail on TODO/FIXME/XXX/HACK/STUB in committed source
        run: |
          set -euo pipefail
          PATTERN='\b(TODO|FIXME|XXX|HACK|STUB)\b'
          if grep -RInE --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git \
               --exclude-dir=.venv --exclude-dir=__pycache__ --exclude-dir=.pytest_cache \
               --exclude-dir=.mypy_cache --exclude-dir=.ruff_cache \
               --exclude-dir=docs --exclude-dir=Arda-link-AI-Docs \
               --exclude='*.md' "$PATTERN" \
               ardalink-api/src ardalink-api/tests \
               ardalink-engine/ardalink_engine ardalink-engine/tests \
               ardalink-web/dashboard/src ardalink-web/dashboard/tests \
               ardalink-web/talk/src ardalink-web/talk/tests \
               ardalink-web/packages/api-client-react/src ardalink-web/packages/api-client-react/tests; then
            echo "::error::TODO/FIXME/XXX/HACK/STUB markers present in committed source."
            exit 1
          fi
      - name: Fail on committed build artefacts or vendor trees (root)
        run: |
          set -euo pipefail
          for d in node_modules .venv dist __pycache__ .pytest_cache .mypy_cache .ruff_cache; do
            found=$(find . -name "$d" -type d -not -path './.git/*' 2>/dev/null | head -3)
            if [ -n "$found" ]; then
              echo "::error::$d present in working tree at: $found"
              exit 1
            fi
          done
      - name: Fail on live .env or .env.local files (anywhere)
        run: |
          set -euo pipefail
          if find . \( -name '.env' -o -name '.env.local' \) -not -path './.git/*' 2>/dev/null | grep -q .; then
            echo "::error::Live .env or .env.local file present. It must never be committed."
            exit 1
          fi
      - name: Fail on Proprietary markers (project is MIT)
        run: |
          set -euo pipefail
          # Use word boundaries so we catch bare 'Proprietary' in e.g.
          # pyproject.toml (license = { text = "Proprietary" }) and not just
          # the hyphenated 'Proprietary-License' form. Also catch the
          # all-rights-reserved copyright line.
          HITS=$(grep -RIl --exclude-dir=.git --exclude-dir=.github \
                --exclude-dir=node_modules --exclude-dir=.venv \
                --exclude-dir=__pycache__ --exclude-dir=dist \
                --exclude='INVENTORY.md' \
                -E '\bProprietary\b|all rights reserved' \
                . 2>/dev/null | grep -v 'INVENTORY.md' || true)
          if [ -n "$HITS" ]; then
            echo "::error::Proprietary markers re-introduced. Project is MIT."
            echo "$HITS"
            exit 1
          fi
      - name: Fail on || true / || echo in package.json scripts
        run: |
          set -euo pipefail
          HITS=$(grep -RInE '"[^"]*\|\| *(true|echo)[^"]*"' \
                --include='package.json' \
                --exclude-dir=node_modules \
                ardalink-api ardalink-engine ardalink-web 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "::error::'|| true' or '|| echo' in a package.json script — scripts must fail loud."
            echo "$HITS"
            exit 1
          fi
      - name: Fail on || echo in CI step commands
        run: |
          set -euo pipefail
          HITS=$(grep -RInE 'run: .*\|\| *echo' \
                --exclude-dir=node_modules \
                .github ardalink-api/.github ardalink-engine/.github ardalink-web/.github 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "::error::'|| echo' in a CI step — steps must fail loud."
            echo "$HITS"
            exit 1
          fi
      - name: Fail on stale MUNENE1212 / munenendegwa6 cross-references
        run: |
          set -euo pipefail
          # Allow them inside docs/ (historical CTI snapshot) and Arda-link-AI-Docs.
          # Public-facing files (READMEs, status, contributing, changelogs,
          # license, runbook) must reference the org, not the personal account.
          HITS=$(grep -RIl --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.venv \
                --exclude-dir=__pycache__ --exclude-dir=dist --exclude-dir=docs \
                --exclude-dir=Arda-link-AI-Docs --exclude-dir=.github \
                -E 'MUNENE1212|munenendegwa6' \
                README.md RUNBOOK.md LOCAL_SETUP.md LICENSE \
                CONTRIBUTING.md CONVENTIONS.md STATUS.md CHANGELOG.md \
                ardalink-api/README.md ardalink-api/CONTRIBUTING.md ardalink-api/CHANGELOG.md \
                ardalink-engine/README.md ardalink-engine/CONTRIBUTING.md ardalink-engine/CHANGELOG.md \
                ardalink-web/README.md ardalink-web/CONTRIBUTING.md ardalink-web/CHANGELOG.md \
                ardalink-marketing/README.md 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "::error::Stale personal-account cross-references in public docs. Update to JHUB-AFRICA/arda-link-ai."
            echo "$HITS"
            exit 1
          fi
      - name: Fail on user-facing jargon (marketing site + poster SVG)
        run: |
          set -euo pipefail
          # NDVI / RLS / JWT / Azure gpt-4o / Express are not allowed in
          # user-facing copy. Source files (.py) are NOT scanned here —
          # only the rendered .svg / .html output.
          if grep -RInE '\b(NDVI|RLS|JWT|gpt-4o)\b' \
               ardalink-marketing/site/*.html \
               ardalink-marketing/poster/poster-*.svg 2>/dev/null; then
            echo "::error::Jargon (NDVI/RLS/JWT/gpt-4o) present in user-facing marketing copy."
            exit 1
          fi
          # "Express" must be a whole word (not part of "Expressway" etc).
          if grep -RInE '\bExpress\b' \
               ardalink-marketing/site/*.html \
               ardalink-marketing/poster/poster-*.svg 2>/dev/null; then
            echo "::error::Jargon ('Express') present in user-facing marketing copy."
            exit 1
          fi
      - name: Fail on INVENTORY.md / session-ses_*.md tracked by git
        run: |
          set -euo pipefail
          TRACKED=$(git ls-files INVENTORY.md session-ses_*.md 2>/dev/null || true)
          if [ -n "$TRACKED" ]; then
            echo "::error::The following are tracked by git but must never be committed:"
            echo "$TRACKED"
            exit 1
          fi

  root-readme:
    name: Root README sanity
    needs: [paths, hygiene]
    if: needs.paths.outputs.root == 'true' || needs.paths.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Root README links to JHUB-AFRICA/arda-link-ai
        run: |
          set -euo pipefail
          grep -q 'github.com/JHUB-AFRICA/arda-link-ai' README.md || {
            echo "::error::README.md must link to https://github.com/JHUB-AFRICA/arda-link-ai"
            exit 1
          }
      - name: Root README is MIT (not Proprietary)
        run: |
          set -euo pipefail
          if grep -qi 'proprietary' README.md; then
            echo "::error::README.md still mentions Proprietary. Project is MIT."
            exit 1
          fi
      - name: RUNBOOK.md points at architecture.md (not legacy ARCHITECTURE.md)
        run: |
          set -euo pipefail
          if grep -nE 'ARCHITECTURE\.md\b' RUNBOOK.md; then
            echo "::error::RUNBOOK.md still references legacy ARCHITECTURE.md. Use Arda-link-AI-Docs/architecture.md."
            exit 1
          fi
          if ! grep -q 'Arda-link-AI-Docs/architecture.md' RUNBOOK.md; then
            echo "::error::RUNBOOK.md should link Arda-link-AI-Docs/architecture.md as the canonical architecture doc."
            exit 1
          fi

  engine:
    name: Engine CI (uv + ruff + pytest)
    needs: [paths, hygiene]
    if: needs.paths.outputs.engine == 'true' || needs.paths.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install uv
      - name: uv sync
        run: cd ardalink-engine && uv sync --all-extras --frozen
      - name: ruff check
        run: cd ardalink-engine && uv run ruff check .
      - name: pytest with coverage floor
        run: cd ardalink-engine && uv run pytest
      - name: secrets scan
        uses: gitleaks/gitleaks-action@v2
        # continue-on-error removed — secrets-scan now GATES the build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: vuln scan (pip-audit)
        run: |
          pip install pip-audit
          cd ardalink-engine && uv export --no-hashes --format=requirements-txt > requirements-ci.txt
          pip-audit -r requirements-ci.txt

  api:
    name: API CI (pnpm + vitest + esbuild)
    needs: [paths, hygiene]
    if: needs.paths.outputs.api == 'true' || needs.paths.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: ardalink-api/node_modules
          key: ${{ runner.os }}-pnpm-api-${{ hashFiles('ardalink-api/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-api-
      - run: cd ardalink-api && pnpm install --frozen-lockfile
      - name: typecheck (strict)
        run: cd ardalink-api && pnpm run typecheck
      - name: test (strict)
        run: cd ardalink-api && pnpm run test
      - name: build + dist artefact check
        run: |
          set -euo pipefail
          cd ardalink-api && pnpm run build
          test -f dist/index.mjs || { echo "::error::dist/index.mjs missing"; exit 1; }
          test -s dist/index.mjs || { echo "::error::dist/index.mjs empty"; exit 1; }
      - name: secrets scan
        uses: gitleaks/gitleaks-action@v2
        # continue-on-error removed — secrets-scan now GATES the build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    name: Web CI (dashboard + talk + api-client-react)
    needs: [paths, hygiene]
    if: needs.paths.outputs.web == 'true' || needs.paths.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: ardalink-web/node_modules
          key: ${{ runner.os }}-pnpm-web-${{ hashFiles('ardalink-web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-web-
      - run: cd ardalink-web && pnpm install --frozen-lockfile
      - name: typecheck (all packages, strict)
        run: cd ardalink-web && pnpm run typecheck
      - name: test (all packages, strict)
        run: cd ardalink-web && pnpm run test
      - name: build + dist artefact check
        run: |
          set -euo pipefail
          cd ardalink-web && pnpm run build
          test -f dashboard/dist/index.html || { echo "::error::dashboard/dist/index.html missing"; exit 1; }
          test -f talk/dist/index.html || { echo "::error::talk/dist/index.html missing"; exit 1; }
      - name: secrets scan
        uses: gitleaks/gitleaks-action@v2
        # continue-on-error removed — secrets-scan now GATES the build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  marketing:
    name: Marketing site (jargon + brand)
    needs: [paths, hygiene]
    if: needs.paths.outputs.marketing == 'true' || needs.paths.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install qrcode
      - name: Install librsvg2-bin (rsvg-convert for PDF regen)
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Regenerate posters from source
        run: |
          set -euo pipefail
          cd ardalink-marketing/poster
          python3 build_posters.py
      - name: Regenerate PDFs from SVG
        run: |
          set -euo pipefail
          cd ardalink-marketing/poster
          rsvg-convert -f pdf -o poster-A0.pdf poster-A0.svg
          rsvg-convert -f pdf -o poster-letter.pdf poster-letter.svg
      - name: Brand palette enforcement
        run: |
          set -euo pipefail
          # Only the brand colours are allowed in the CSS file. Hard-coded
          # hex values elsewhere are flagged.
          ALLOWED='(#0B0B12|#15151F|#1C1C28|#2A2A38|#F5F5F4|#A8A29E|#71717A|#F59E0B|#FF3C00|#84CC16|#38BDF8|#DC2626)'
          HITS=$(grep -RInE '#[0-9a-fA-F]{6}' ardalink-marketing/site/assets/css/style.css \
                 | grep -vE "$ALLOWED" || true)
          if [ -n "$HITS" ]; then
            echo "::error::Off-brand hex values in style.css:"
            echo "$HITS"
            exit 1
          fi
      - name: Final jargon grep (post-regen)
        run: |
          set -euo pipefail
          for jargon in NDVI RLS JWT 'gpt-4o' Express; do
            if grep -RInE "\\b${jargon}\\b" ardalink-marketing/site/*.html \
                                      ardalink-marketing/poster/poster-*.svg 2>/dev/null; then
              echo "::error::Jargon '${jargon}' present in user-facing marketing copy."
              exit 1
            fi
          done
      - name: Static-serve smoke test
        run: |
          set -euo pipefail
          cd ardalink-marketing/site
          python3 -m http.server 8765 &
          SERVER_PID=$!
          sleep 2
          # All 7 HTML pages must respond 200
          for page in index.html problem.html solution.html how-it-works.html demo.html business.html team.html; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8765/$page")
            if [ "$code" != "200" ]; then
              echo "::error::$page returned HTTP $code"
              kill $SERVER_PID 2>/dev/null || true
              exit 1
            fi
          done
          kill $SERVER_PID 2>/dev/null || true

  docs:
    name: Long-form docs (Arda-link-AI-Docs)
    needs: [paths, hygiene]
    if: needs.paths.outputs.docs == 'true' || needs.paths.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Every doc file must be ≤ 200 KB and ≤ 1500 lines
        run: |
          set -euo pipefail
          for f in Arda-link-AI-Docs/*.md; do
            sz=$(stat -c%s "$f")
            lc=$(wc -l < "$f")
            if [ "$sz" -gt 204800 ]; then
              echo "::error::$f is $sz bytes (> 200 KB). Split it."
              exit 1
            fi
            if [ "$lc" -gt 1500 ]; then
              echo "::error::$f is $lc lines (> 1500). Split it."
              exit 1
            fi
          done
      - name: Cross-references resolve
        run: |
          set -euo pipefail
          # Every relative .md link inside Arda-link-AI-Docs must point
          # to a file that exists. Anchors are stripped before checking.
          cd Arda-link-AI-Docs
          broken=0
          while IFS= read -r ref; do
            target="${ref#./}"
            # Strip anchor (#) and everything after it
            target="${target%%#*}"
            if [ ! -f "$target" ]; then
              echo "::error::Broken reference in docs: $ref"
              broken=1
            fi
          done < <(grep -hoE '\]\([^)]+\.md[^)]*\)' *.md | sed -E 's/^\]\(([^)]+)\)$/\1/' | grep -E '^[./]' || true)
          exit $broken

  summary:
    name: All-green summary
    needs:
      - paths
      - hygiene
      - root-readme
      - engine
      - api
      - web
      - marketing
      - docs
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check all jobs succeeded
        run: |
          set -euo pipefail
          # GitHub Actions exposes each job's result via the needs.<job_id>.result
          # expression. The expression engine does NOT expand shell variables
          # inside the expression syntax — so we hardcode the list here. Adding
          # a new required job means adding it both to 'needs' above and to
          # this map.
          declare -A results
          results[hygiene]="${{ needs.hygiene.result }}"
          results[root-readme]="${{ needs.root-readme.result }}"
          results[engine]="${{ needs.engine.result }}"
          results[api]="${{ needs.api.result }}"
          results[web]="${{ needs.web.result }}"
          results[marketing]="${{ needs.marketing.result }}"
          results[docs]="${{ needs.docs.result }}"
          for j in "${!results[@]}"; do
            r="${results[$j]}"
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::$j job status: $r"
              exit 1
            fi
          done
          echo "✓ All required jobs passed (or were skipped because no paths matched)"