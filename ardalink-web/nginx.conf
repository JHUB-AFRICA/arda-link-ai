server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Health endpoint for container healthcheck
    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    # Public Talk app
    location /talk/ {
        alias /usr/share/nginx/html/talk/;
        try_files $uri $uri/ /talk/index.html;
    }

    # Operator dashboard (default)
    location / {
        alias /usr/share/nginx/html/dashboard/;
        try_files $uri $uri/ /index.html;
    }

    # Long cache for hashed assets
    location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
}